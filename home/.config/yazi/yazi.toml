[mgr]
ratio = [1, 2, 3]
linemode = "size"

[preview]
wrap = "yes"

[plugin]
prepend_previewers = [
    # mcat is faster and prettier than glow. need to strip the OSC 8 hyperlink escape sequences
    { url = "*.{md,docx,xls,xlsx,xlsm,xlsb,xla,xlam,odt,odp,pptx,ods}", run = 'piper -- mcat -P -c -f --sc "$w"xauto --theme=kanagawa "$1" | perl -pe "s/\e\]8;[^;]*;[^\e]*\e\\\\//g"' },
    # chawan or w3m for html rendering
    { url = "*.html", run = 'piper -- (command -v cha >/dev/null 2>&1 && cha -d "$1") || w3m -dump "$1"' },

    # mediainfo
    # Replace magick, image, video with mediainfo
    { mime = "{audio,video,image}/*", run = "mediainfo"},
    { mime = "application/subrip", run = "mediainfo" },
    # Adobe Illustrator, Adobe Photoshop is image/adobe.photoshop, already handled above
    { mime = "application/postscript", run = "mediainfo" },
]
prepend_preloaders = [
    # mediainfo
    # Replace magick, image, video with mediainfo
    { mime = "{audio,video,image}/*", run = "mediainfo" },
    { mime = "application/subrip", run = "mediainfo" },
    # Adobe Illustrator, Adobe Photoshop is image/adobe.photoshop, already handled above
    { mime = "application/postscript", run = "mediainfo" },
]
prepend_fetchers = [
    { url = "*", run = "git", group = "git" },
    { url = "*/", run = "git", group = "git" },
]
